syntax = "proto3";

option java_package = "com.reiux.lumen.proto";

message CommitUpload {
  message MediaInfo {
    message TokenData {
      int64 field1 = 1;
      bytes field2 = 2;
    }
    TokenData field1 = 1;
    string file_name = 2;
    bytes sha1_hash = 3;

    message TimestampData {
      int64 file_last_modified_timestamp = 1;
      int64 field2 = 2;
    }
    TimestampData field4 = 4;
    int64 quality = 7;
    int64 field10 = 10;
  }
  MediaInfo field1 = 1;

  message DeviceInfo {
    string model = 3;
    string make = 4;
    int64 android_api_version = 5;
  }
  DeviceInfo field2 = 2;

  bytes field3 = 3;
}
