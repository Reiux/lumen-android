import java.time.LocalDate
import java.time.ZoneOffset
import java.time.format.DateTimeFormatter

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.protobuf'
}

def gitShortHash = { File projectDir ->
    try {
        def proc = new ProcessBuilder("git", "rev-parse", "--short", "HEAD")
            .directory(projectDir)
            .redirectErrorStream(true)
            .start()
        def out = proc.inputStream.getText("UTF-8").trim()
        if (proc.waitFor() == 0 && out ==~ /[0-9a-fA-F]{6,12}/) out else null
    } catch (Throwable ignored) {
        null
    }
}

def buildDateUtc = LocalDate.now(ZoneOffset.UTC)
    .format(DateTimeFormatter.BASIC_ISO_DATE)

android {
    namespace 'com.reiux.lumen'
    compileSdk 37

    defaultConfig {
        applicationId "com.reiux.lumen"
        minSdk 26
        targetSdk 37
        versionCode 10304
        versionName "1.3.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def ksPropFile = rootProject.file("keystore.properties")
            def ksProps = new Properties()
            if (ksPropFile.exists()) {
                ksPropFile.withInputStream { ksProps.load(it) }
            }

            def sf = ksProps.getProperty("storeFile") ?: System.getenv("LUMEN_KEYSTORE_FILE")
            def sp = ksProps.getProperty("storePassword") ?: System.getenv("LUMEN_KEYSTORE_PASSWORD")
            def ka = ksProps.getProperty("keyAlias") ?: System.getenv("LUMEN_KEY_ALIAS")
            def kp = ksProps.getProperty("keyPassword") ?: System.getenv("LUMEN_KEY_PASSWORD")

            def sfFile = null
            if (sf) {
                def candidate = file(sf)
                sfFile = candidate.exists() ? candidate : rootProject.file(sf)
            }
            if (sfFile && sfFile.exists() && sp && ka && kp) {
                storeFile sfFile
                storePassword sp
                keyAlias ka
                keyPassword kp
            }
        }
    }

    buildTypes {
        debug {
            def hash = gitShortHash(rootProject.projectDir)
            def devTag = hash != null ? "${hash}.${buildDateUtc}" : buildDateUtc
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev.${devTag}"
            manifestPlaceholders = [appName: "Lumen Dev"]
            signingConfig signingConfigs.debug
        }
        release {
            manifestPlaceholders = [appName: "Lumen"]
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3ExpressiveApi"
        ]
    }

    buildFeatures {
        compose true
        buildConfig true
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def explicitReleaseArtifactRequested = gradle.startParameter.taskNames.any { rawName ->
        def simpleName = rawName.substring(rawName.lastIndexOf(':') + 1).toLowerCase(java.util.Locale.ROOT)
        simpleName == "assemblerelease" ||
            simpleName == "bundlerelease" ||
            simpleName == "packagerelease" ||
            simpleName == "packagereleasebundle" ||
            simpleName == "signreleasebundle"
    }
    def packagesReleaseArtifact = taskGraph.allTasks.any { task ->
        task.project == project && (
            task.name == "packageRelease" ||
            task.name == "packageReleaseBundle" ||
            task.name == "signReleaseBundle"
        )
    }
    if (explicitReleaseArtifactRequested && packagesReleaseArtifact && android.signingConfigs.release.storeFile == null) {
        throw new GradleException("Release keystore is not configured. Refusing to sign or package release build without release credentials.")
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.5'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.window:window:1.3.0'

    // Compose & Material 3 Expressive (BOM 2025.09.01 -> Compose 1.9.2, compatible with Kotlin 2.0.21 & AGP 8.13)
    implementation platform('androidx.compose:compose-bom:2025.09.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha13'
    implementation 'androidx.graphics:graphics-shapes:1.1.0'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.5'

    // WorkManager & Background Sync
    implementation 'androidx.work:work-runtime-ktx:2.10.0'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Protobuf
    implementation 'com.google.protobuf:protobuf-javalite:3.25.5'

    // DataStore Preferences
    implementation 'androidx.datastore:datastore-preferences:1.1.2'

    // Image loading
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // Security & Encryption
    implementation 'androidx.security:security-crypto:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.09.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
