name: Lumen Release Build

# Releases are published exclusively from version tags (or manually).
# Triggering on every push to `main` re-published the current release and
# reset its download counters on unrelated merges (e.g. docs-only PRs);
# regular build/test coverage for main pushes lives in ci.yml.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_CERT_SHA256: 697c9d2360ae5714a88695e4c9e8bc1c370b1c5bd1a0a0c57b637e16c271fbf3

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Tests and Lint
        run: env -u ANDROID_PREFS_ROOT ./gradlew testDebugUnitTest lintDebug lintRelease

  release:
    name: Build & Publish Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Determine Release Tag
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle | head -n1 || true)
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to extract versionName from app/build.gradle"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$VERSION"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)*(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "::error::Malformed release tag '$TAG'"
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Check tag matches app version
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle | head -n1 || true)
          if [ -z "$VERSION" ]; then
            echo "::error::app/build.gradle versionName is empty"
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)*(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "::error::RELEASE_TAG '$RELEASE_TAG' does not match strict semver pattern"
            exit 1
          fi
          if [ "v$VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match app/build.gradle versionName v$VERSION"
            exit 1
          fi

      - name: Setup keystore
        env:
          KS_BASE64: ${{ secrets.LUMEN_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.LUMEN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUMEN_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.LUMEN_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_BASE64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Missing signing secrets"
            exit 1
          fi
          umask 077
          echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build
        env:
          LUMEN_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          LUMEN_KEYSTORE_PASSWORD: ${{ secrets.LUMEN_KEYSTORE_PASSWORD }}
          LUMEN_KEY_ALIAS: ${{ secrets.LUMEN_KEY_ALIAS }}
          LUMEN_KEY_PASSWORD: ${{ secrets.LUMEN_KEY_PASSWORD }}
        run: env -u ANDROID_PREFS_ROOT ./gradlew assembleRelease assembleDebug

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Verify release signature
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK not found at $RELEASE_APK"
            exit 1
          fi
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner tool not found"
            exit 1
          fi
          CERT_DIGEST=$("$APKSIGNER" verify --print-certs "$RELEASE_APK" | grep -i "certificate SHA-256 digest" | head -n1 | awk '{print $NF}')
          if [ -z "$CERT_DIGEST" ]; then
            echo "::error::Failed to extract certificate SHA-256 digest from $RELEASE_APK"
            exit 1
          fi
          LOWER_ACTUAL=$(echo "$CERT_DIGEST" | tr '[:upper:]' '[:lower:]')
          LOWER_EXPECTED=$(echo "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]')
          if [ "$LOWER_ACTUAL" != "$LOWER_EXPECTED" ]; then
            echo "::error::Signature mismatch: expected $LOWER_EXPECTED, got $LOWER_ACTUAL"
            exit 1
          fi
          echo "CERT_SHA256=$CERT_DIGEST" >> "$GITHUB_ENV"

      - name: Stage assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/lumen-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/lumen-test-debug.apk

      - name: Write release notes
        run: |
          mkdir -p dist
          NOTES_FILE=".github/release-notes/$RELEASE_TAG.md"
          if [ -f "$NOTES_FILE" ]; then
            cat "$NOTES_FILE" > dist/notes.md
          else
            if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
              TARGET_REF="$RELEASE_TAG"
            else
              TARGET_REF="HEAD"
            fi
            PREV_TAG=$(git describe --tags --abbrev=0 "${TARGET_REF}^" 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              RAW_LOG=$(git log "$PREV_TAG..$TARGET_REF" --pretty=format:'- %s')
            else
              RAW_LOG=$(git log -n 10 "$TARGET_REF" --pretty=format:'- %s')
            fi
            FILTERED_LOG=$(printf '%s\n' "$RAW_LOG" | grep -vE '^- (ci|chore|docs)([:\(].*)?$' || true)
            
            echo "### Changes" > dist/notes.md
            if [ -n "$(echo "$FILTERED_LOG" | tr -d '[:space:]')" ]; then
              echo "$FILTERED_LOG" >> dist/notes.md
            else
              echo "- Maintenance release." >> dist/notes.md
            fi
          fi

          APK_SHA256=$(sha256sum dist/lumen-release.apk | awk '{print $1}')
          if [ -z "$APK_SHA256" ]; then
            echo "::error::Failed to compute SHA-256 digest for dist/lumen-release.apk"
            exit 1
          fi
          DEBUG_APK_SHA256=$(sha256sum dist/lumen-test-debug.apk | awk '{print $1}')
          if [ -z "$DEBUG_APK_SHA256" ]; then
            echo "::error::Failed to compute SHA-256 digest for dist/lumen-test-debug.apk"
            exit 1
          fi

          echo "" >> dist/notes.md
          echo "### Verification" >> dist/notes.md
          echo "- **Release APK Certificate SHA-256:** \`$CERT_SHA256\`" >> dist/notes.md
          echo "- \`lumen-test-debug.apk\` is signed with the debug key and is for testing only." >> dist/notes.md
          echo "" >> dist/notes.md
          echo '```text' >> dist/notes.md
          echo "$APK_SHA256  lumen-release.apk" >> dist/notes.md
          echo "$DEBUG_APK_SHA256  lumen-test-debug.apk" >> dist/notes.md
          echo '```' >> dist/notes.md

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Lumen ${{ env.RELEASE_TAG }}
          body_path: dist/notes.md
          files: |
            dist/lumen-release.apk
            dist/lumen-test-debug.apk
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
