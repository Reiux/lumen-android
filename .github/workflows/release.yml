name: Lumen Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Keystore
        run: |
          if [ -n "${{ secrets.LUMEN_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding repository release keystore..."
            echo "${{ secrets.LUMEN_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "storeFile=../release.keystore" > keystore.properties
            echo "storePassword=${{ secrets.LUMEN_KEYSTORE_PASSWORD }}" >> keystore.properties
            echo "keyAlias=${{ secrets.LUMEN_KEY_ALIAS }}" >> keystore.properties
            echo "keyPassword=${{ secrets.LUMEN_KEY_PASSWORD }}" >> keystore.properties
          else
            echo "Generating fallback keystore for CI build..."
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore release.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
            echo "storeFile=../release.keystore" > keystore.properties
            echo "storePassword=android" >> keystore.properties
            echo "keyAlias=androiddebugkey" >> keystore.properties
            echo "keyPassword=android" >> keystore.properties
          fi

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug

      - name: Prepare APK Assets and Verification Hashes
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk lumen-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk lumen-release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk lumen-dev-debug.apk
          fi

          CERT_SHA256=$(keytool -printcert -jarfile lumen-release.apk | grep "SHA256:" | head -n 1 | awk '{print $2}')
          if [ -z "$CERT_SHA256" ]; then
            CERT_SHA256="N/A"
          fi
          FILE_SHA256=$(sha256sum lumen-release.apk | awk '{print $1}')

          echo "CERT_SHA256=$CERT_SHA256" >> $GITHUB_ENV
          echo "FILE_SHA256=$FILE_SHA256" >> $GITHUB_ENV

      - name: Upload or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lumen-release.apk
            lumen-dev-debug.apk
          prerelease: false
          overwrite: true
          body: |
            ### Fixes & Improvements
            - Restored "Queue is empty" state and recent activity visibility in portrait orientation.
            - Added 2-pane split view for onboarding on landscape and tablet screens.

            ### Changes in v1.1.2
            - Added encrypted account storage using Android KeyStore.
            - Added commit recovery with circuit breaker protection and no plaintext fallback.
            - Added auto-update toggle in settings.
            - Added GitHub CI build workflow and release automation.
            - Fixed settings UI rendering issues.
            - Updated README privacy documentation.

            ### Verification
            - **Certificate SHA-256**: `${{ env.CERT_SHA256 }}`
            - **APK SHA-256**: `${{ env.FILE_SHA256 }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
